name: Refresh dashboard and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "scripts/**"
      - "data/config.json"
      - "data/drive_source.json"
      - "next.config.mjs"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: availability-report-pages
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify project package
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "app/page.jsx"
            "next.config.mjs"
            "package.json"
            "public/js/app.js"
            "scripts/preflight.py"
            "scripts/download_drive_data.py"
            "scripts/build_data.py"
            "scripts/validate_build.py"
            "scripts/tests/test_model.py"
            "data/config.json"
            "data/drive_source.json"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required project file is missing: $file"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 2
          fi
          echo "All required project files are present."

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic tests
        run: npm test

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check "gdown==6.1.0" "openpyxl>=3.1"

      - name: Preflight source files
        run: python scripts/preflight.py

      - name: Test Python data pipeline
        run: python scripts/tests/test_model.py

      - name: Download source workbooks
        run: python scripts/download_drive_data.py

      - name: Build dashboard data
        run: python scripts/build_data.py

      - name: Validate built dataset
        run: python scripts/validate_build.py

      - name: Build static Next.js export
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
